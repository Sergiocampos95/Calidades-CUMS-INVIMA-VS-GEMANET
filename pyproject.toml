[project]
name = "gemma-cum-loader"
version = "0.1.0"
description = "Automatizacion del cargue de medicamentos CUM/IUM - INVIMA -> Gemma Net (Pijao Salud)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "anthropic>=0.122",
    "requests>=2.32",
]

[project.scripts]
gemma-cum-loader = "gemma_cum_loader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_cum_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
