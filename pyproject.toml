[project]
name = "gemma-cum-loader"
version = "0.1.0"
description = "Automatizacion del cargue de medicamentos CUM/IUM - INVIMA -> Gemma Net (Pijao Salud)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "anthropic>=0.122",
    "requests>=2.32",
    # Lectura del catalogo de Gemma Net (marca, unidad, modelo de servicio)
    # directo de su Postgres, en vez de los CSV copiados a mano en
    # config/catalogos/. Justifica su peso: el CSV de marca tiene 893 entradas
    # y deja 15.979 candidatos sin marca resuelta -- es el cuello de botella
    # del proceso. psycopg 3 y no psycopg2: es la version mantenida, y
    # [binary] evita exigir un compilador de C en las maquinas del equipo.
    "psycopg[binary]>=3.2",
    # worker/ (Fase 1 de la migracion fuera de Streamlit, ver
    # .claude/plans -- plan de arquitectura del 2026-08-27): scheduler del
    # proceso en segundo plano que refresca los datos cada ~50 min. Sin
    # broker externo (Celery+Redis seria infraestructura de mas para una
    # sola tarea periodica en un solo proceso).
    "apscheduler>=3.10",
    # worker/almacen_snapshots.py: motor Parquet para pandas. Se eligio
    # sobre JSON/SQLite para los snapshots grandes (~535 MB) porque es
    # columnar y pandas ya lo integra nativamente (to_parquet/read_parquet).
    "pyarrow>=17.0",
    # backend/ (Fase 2 de la migracion fuera de Streamlit): API tipada que
    # solo LEE los snapshots del worker -- nunca ejecuta el pipeline pesado
    # ni habla con Gemma Net/INVIMA directo (ver backend/app/dependencies.py).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
gemma-cum-loader = "gemma_cum_loader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # TestClient de FastAPI (backend/tests/) lo requiere en tiempo de prueba.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_cum_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)` como valor por defecto es el patron OBLIGATORIO
# de FastAPI (backend/app/routers/*.py) -- no el bug de "llamada mutable en
# default" que B008 busca detectar. Ruff no distingue esto sin esta lista.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]
