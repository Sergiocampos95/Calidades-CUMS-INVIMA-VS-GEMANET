# Configuracion de Streamlit para el modulo. SI se versiona: es configuracion
# del proyecto, no del equipo de cada quien (las credenciales van aparte, en
# variables de entorno -- ver integraciones/gemanet_db.py).

[client]
# "viewer" oculta la barra de desarrollador: el boton "Deploy" (que ofrece
# publicar la app en la nube de Streamlit o Snowflake) y el menu de "Rerun /
# Clear cache / Record screencast". Nada de eso tiene que ver con el modulo y
# quien lo usa no deberia siquiera poder pulsarlo -- un "Deploy" accidental
# sobre una aplicacion que consulta produccion de Pijao Salud no es un riesgo
# hipotetico. Para depurar, basta con volver a "developer" un rato.
toolbarMode = "viewer"

# Los errores se muestran completos: este modulo lo opera gente que reporta
# los fallos a quien lo mantiene, y un traceback recortado hace ese reporte
# inutil. Lo que NO debe aparecer en pantalla es detalle tecnico gratuito en
# el flujo normal -- eso ya se resolvio en la UI (ver _alerta_fallo_lectura).
showErrorDetails = true

[server]
# El modulo lee archivos de decenas de MB (el reporte de Gemma Net son 32 MB)
# y el limite por defecto de Streamlit es 200 MB. Se deja explicito para que
# no sorprenda el dia que un listado crezca.
maxUploadSize = 300

[browser]
# Sin telemetria: la aplicacion trabaja contra datos de produccion de una EPS.
gatherUsageStats = false

[theme]
# Streamlit pinta radios/checkboxes/toggles/sliders con su rojo de acento por
# defecto (#FF4B4B) si no se fija aqui -- se veia como una alerta o una
# seleccion "en rojo" incluso en la navegacion lateral, que no es un estado
# de error. Mismo azul que "primario" en design/design_tokens.json.
primaryColor = "#2A4D8F"    
