<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calidades CUMS</title>
    <link rel="stylesheet" href="/src/estilo.css" />
  </head>
  <body>
    <div class="pantalla-ingreso oculto" id="pantalla-ingreso"></div>
    <div class="app-shell">
      <header class="topbar">
        <img class="logo" src="logo-pijaos.jpg" alt="Pijaos Salud EPSI" />
        <div class="titulo">Calidades CUMS<small>Pijaos Salud EPSI · GemaNet</small></div>
        <nav id="nav-principal"></nav>
        <div class="usuario" id="usuario-sesion"></div>
      </header>

      <div class="col-principal">
        <main class="contenido">
          <div class="pagina-cabecera">
            <div class="miga">
              <div class="miga__ruta" id="miga-ruta">Bandeja</div>
              <h1 class="miga__titulo" id="miga-titulo">Bandeja de calidades</h1>
            </div>
            <div class="pagina-acciones">
              <button class="btn btn--suave oculto" id="boton-volver" title="Volver a la pantalla anterior">← Volver</button>
              <div class="refresco" id="refresco" title="Antigüedad de los datos (se recalculan cada 50 min)">
                <div class="refresco__anillo" id="anillo-refresco"></div>
                <div class="refresco__texto"><strong id="texto-refresco">—</strong><span id="subtexto-refresco">consultando…</span></div>
              </div>
              <button class="btn btn--suave" id="boton-actualizar-ahora" title="Actualizar los datos ahora, sin esperar al ciclo automático">⟳ Actualizar ahora</button>
            </div>
          </div>

          <div class="banner oculto" id="banner-salud"></div>
          <div class="panel-progreso oculto" id="panel-progreso"></div>

          <nav class="subnav" id="subnav"></nav>

          <div class="vista" id="vista"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
